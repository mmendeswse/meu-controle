name: Atualizar personagens do avatar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda-feira
  push:
    branches: [main]
    paths: ["scripts/atualizar-personagens.mjs"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar-personagens.mjs
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain dados/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add dados/personagens.json
            git commit -m "Atualiza personagens do avatar"
            git push
          fi
