<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Controle">
<link rel="manifest" href="manifest.json?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?v=1">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png?v=1">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png?v=1">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=1">
<meta name="color-scheme" content="dark">
<title>Meu Controle — Vida & Fitness</title>
<link rel="stylesheet" href="css/style.css?v=1.0.0">
</head>
<body>

<div class="shell">

  <div class="scrim-menu" id="scrimMenu"></div>

  <aside class="sidebar" id="sidebar">
    <button class="logo" id="btnLogo" title="Ir para o Dashboard" data-secao="dashboard">
      <div class="logo-mark"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="17" width="6" height="14" rx="2" fill="currentColor" stroke="none"/><rect x="36" y="17" width="6" height="14" rx="2" fill="currentColor" stroke="none"/><rect x="12" y="20" width="4" height="8" rx="1.5" fill="currentColor" stroke="none"/><rect x="32" y="20" width="4" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M16 24h16"/></svg></div>
      <div class="logo-txt"><b>Meu Controle</b><span>Vida & Fitness</span></div>
    </button>

    <nav class="nav" id="navPrincipal">
      <button data-secao="dashboard"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg>Dashboard</button>
      <button data-secao="usuarios"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c.6-3.2 3-5 6-5s5.4 1.8 6 5"/></svg>Usuários</button>
      <button data-secao="compras"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2 9h8l2-6H6"/><circle cx="8" cy="16" r="1.2"/><circle cx="14" cy="16" r="1.2"/></svg>Compras</button>
      <button data-secao="gastos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15V9M10 15V5M15 15v-6"/><path d="M3 17h14"/></svg>Gastos</button>
      <button data-secao="alimentacao"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a2 2 0 0 0 4 0V3"/><path d="M8 9v8"/><path d="M14 3c-1.5 1.5-2 4-2 6h2v8"/></svg>Refeições</button>
      <button data-secao="academia"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="3" height="6" rx="1"/><rect x="15" y="7" width="3" height="6" rx="1"/><rect x="5" y="8.5" width="2" height="3" rx=".6"/><rect x="13" y="8.5" width="2" height="3" rx=".6"/><path d="M7 10h6"/></svg>Academia</button>
      <button data-secao="semana"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="1.5"/><path d="M3 8h14"/><path d="M7 2.5v3M13 2.5v3"/><path d="M6.5 11.5h2M11.5 11.5h2M6.5 14.5h2"/></svg>Semana</button>
      <button data-secao="evolucao"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l4.5-4.5L11 12l6-6"/><path d="M13 6h4v4"/></svg>Evolução</button>
      <button data-secao="relatorio"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h7l3 3v11H5z"/><path d="M12 3v3h3"/><path d="M7.5 10h5M7.5 13h5"/></svg>Relatório</button>
      <div class="nav-sep"></div>
      <button data-secao="configuracoes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6L15 15M15 5l-1.4 1.4M6.4 13.6L5 15"/></svg>Ajustes</button>
    </nav>
    <div class="nav-ferramentas">
        <label class="seletor-usuario" title="Pessoa selecionada — filtra todas as telas">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c.6-3.2 3-5 6-5s5.4 1.8 6 5"/></svg>
          <select id="selUsuario" aria-label="Pessoa"></select>
        </label>
        <div class="status-vivo" id="statusVivo" title="Data e hora locais"><span class="dot-vivo"></span><span id="dataTopbar" class="data-topbar"></span><span id="relogioTopbar">--:--:--</span></div>
        <button class="icon-btn" id="btnNotificacoes" aria-label="Notificações" title="Notificações">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a4 4 0 0 1 8 0c0 3.5 1.2 4.5 1.2 4.5H4.8S6 11.5 6 8z"/><path d="M8.3 15a1.8 1.8 0 0 0 3.4 0"/></svg>
          <span class="bolinha" id="badgeNotificacoes" style="display:none">0</span>
        </button>
        <div class="dropdown" id="dropdownNotificacoes"></div>
    </div>

    <div class="sidebar-meta" id="sidebarMeta"></div>
    <div class="sidebar-rodape">100% local · seus dados não saem do navegador</div>
  </aside>

  <div class="main">
    <div style="display:none"><h1 id="tituloSecao"></h1><div id="subtituloSecao"></div></div>

    <div class="scroll">
      <div id="conteudo"></div>
      <div class="rodape-app"><span id="rodapeAtualizado"></span><span>Armazenamento local · nenhum dado sai do navegador</span><span>Meu Controle v1.0</span></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="inputImportarBackup" accept="application/json" style="display:none">

<!-- bibliotecas de terceiros (offline, incluídas no projeto) -->
<script src="js/vendor/chart.umd.min.js"></script>

<!-- módulos do sistema — ordem importa: cada um usa o anterior -->
<script src="js/armazenamento.js?v=1.0.0"></script>
<script src="js/fitness.js?v=1.0.0"></script>
<script src="js/alimentacao.js?v=1.0.0"></script>
<script src="js/graficos.js?v=1.0.0"></script>
<script src="js/app.js?v=1.0.0"></script>
<script>
  // registra o service worker (só funciona via http/https — no celular, depois de publicado)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
